# nginx in front of ttyd — the only listener on the container's network
# interface. ttyd has no client allowlist, and every app shares the hassio
# Docker network, so a directly exposed ttyd would hand a root shell (and the
# Claude login) to any other container. Ingress traffic always arrives from
# the Supervisor at 172.30.32.2; loopback is for the HEALTHCHECK.
user root;
worker_processes 1;
pid /run/nginx.pid;
error_log stderr warn;

events {
    worker_connections 64;
}

http {
    access_log off;
    server_tokens off;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 8099;

        allow 172.30.32.2;
        allow 127.0.0.1;
        deny  all;

        location / {
            proxy_pass http://127.0.0.1:7681;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_buffering off;
            # ttyd pings every 30s, but an idle tab must never be cut
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
        }
    }
}
