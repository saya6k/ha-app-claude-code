# System-wide tmux config for the Claude Code terminal. Override in
# ~/.tmux.conf (/data/home/.tmux.conf), which tmux reads after this file.
set -g default-terminal "tmux-256color"
# ttyd (xterm.js) renders 24-bit colour; let Claude Code use it.
set -as terminal-features ",xterm-256color:RGB"
set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on
# Wheel scrolls tmux history; dragging selects in tmux and copies to the
# browser clipboard via OSC 52 (handled by ttyd-extras.js on the page).
# Shift+drag (Option+drag on macOS) still gives a browser-side selection.
set -g mouse on
set -g set-clipboard on
# ttyd advertises xterm-256color, whose terminfo lacks Ms, so tmux would
# never emit OSC 52. Teach it the sequence explicitly.
set -ga terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'
set -g status off
