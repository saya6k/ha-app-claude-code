# System-wide tmux config for the Claude Code terminal. Override in
# ~/.tmux.conf (/data/home/.tmux.conf), which tmux reads after this file.
set -g default-terminal "tmux-256color"
# ttyd (xterm.js) renders 24-bit colour; let Claude Code use it.
set -as terminal-features ",xterm-256color:RGB"
set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on
# Wheel scrolls tmux history. With mouse mode on, use Shift+drag
# (Option+drag on macOS) for a browser-side text selection.
set -g mouse on
set -g status off
