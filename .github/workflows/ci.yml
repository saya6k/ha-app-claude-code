---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-addon:
    name: Add-on lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: frenck/action-addon-linter@v2
        with:
          path: "./claude-code"

  lint-yaml:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: frenck/action-yamllint@v1

  lint-dockerfile:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: claude-code/Dockerfile
          failure-threshold: warning

  lint-shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Collect shell scripts
        id: collect
        run: |
          set -euo pipefail
          mapfile -t FILES < <( { find claude-code/rootfs \
            -type f \( -name '*.sh' -o -name 'run' -o -name 'finish' \) ;
            find claude-code/rootfs/usr/local/bin -type f ;
            find claude-code -maxdepth 1 -type f -name '*.sh' ; } \
            2>/dev/null | sort -u || true)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "${FILES[@]}" > /tmp/shellcheck-targets
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - name: shellcheck
        if: steps.collect.outputs.found == 'true'
        run: |
          set -euo pipefail
          mapfile -t FILES < /tmp/shellcheck-targets
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            --severity=warning --shell=bash "${FILES[@]}"

  lint-unicode:
    name: Unicode whitespace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for Unicode whitespace
        run: |
          set -euo pipefail
          FOUND=$(find claude-code -type f \( \
            -name '*.yaml' -o -name '*.yml' -o \
            -name '*.py'   -o -name '*.sh'  -o \
            -name 'run'    -o -name 'finish' -o \
            -path 'claude-code/rootfs/usr/local/bin/*' \
          \) -print0 \
            | xargs -0 --no-run-if-empty grep -Pln \
              '[\x{a0}\x{2002}-\x{200b}\x{202f}\x{205f}\x{3000}]' \
              2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Unicode whitespace found in:"
            echo "$FOUND"
            exit 1
          fi
          echo "OK — no Unicode whitespace"

  lint-markdown:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            README.md
            claude-code/DOCS.md
            claude-code/README.md

  build-test:
    name: build test (${{ matrix.arch }})
    if: github.ref != 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: claude-code
          platforms: ${{ matrix.platform }}
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=${{ matrix.arch }}

  # Boots the image under apparmor.txt on an AppArmor-enabled runner and
  # exercises the real paths (s6, nginx → ttyd, claude in tmux,
  # claude-select download, git, user scripts in /config). Any DENIED line
  # for the profile in the kernel log fails the job.
  apparmor:
    name: AppArmor runtime
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t claude-code-test claude-code
      - name: Load profile
        run: |
          set -euo pipefail
          sudo apparmor_parser -r -W claude-code/apparmor.txt
          sudo aa-status | grep -F hassio_claude-code
      - name: Boot and exercise under the profile
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/config" "$RUNNER_TEMP/addon_config"
          docker run -d --name cc \
            --security-opt apparmor=hassio_claude-code \
            -v "$RUNNER_TEMP/config:/config" \
            -v "$RUNNER_TEMP/addon_config:/addon_config" \
            claude-code-test
          for _ in $(seq 1 60); do
            docker logs cc 2>&1 | grep -q 'service nginx successfully started' && break
            sleep 2
          done
          docker exec cc cat /proc/1/attr/current
          docker exec cc curl -fs -o /dev/null http://127.0.0.1:8099/
          docker exec cc curl -fs http://127.0.0.1:8099/ | grep -qF 'Symbols Nerd Font Mono'
          docker exec cc curl -fs -o /dev/null http://127.0.0.1:8099/fonts/SymbolsNerdFontMono-Regular.ttf
          docker exec cc claude --version
          docker exec cc ha --help >/dev/null
          docker exec cc claude-select 2.1.328
          docker exec cc claude --version | grep -F 2.1.328
          docker exec cc sh -c 'git -C /config init -q && rg --version >/dev/null'
          echo '{"workspace":{"current_dir":"/config"},"model":{"display_name":"Opus"},"rate_limits":{"five_hour":{"used_percentage":42}}}' \
            | docker exec -i cc claudebar render | grep -F '42%'
          docker exec cc sh -c 'printf "#!/bin/sh\necho ok\n" > /config/t.sh && chmod +x /config/t.sh && /config/t.sh'
          docker exec cc sh -c 'TERM=xterm-256color tmux new-session -d -s claude -x 120 -y 40 -c /config "claude; exec bash -l"'
          sleep 10
          docker exec cc tmux capture-pane -p -t claude | grep -F 'Claude Code'
      - name: Container log
        if: always()
        run: docker logs cc 2>&1 | tail -50
      - name: Check for AppArmor denials
        if: always()
        run: |
          set -euo pipefail
          denials=$(sudo dmesg | grep 'apparmor="DENIED"' | grep 'hassio_claude-code' || true)
          if [ -n "$denials" ]; then
            echo "$denials"
            echo "::error::AppArmor denials for hassio_claude-code"
            exit 1
          fi
          echo "No AppArmor denials"

  ci-ok:
    name: CI passed
    if: always()
    needs:
      - lint-addon
      - lint-yaml
      - lint-dockerfile
      - lint-shell
      - lint-unicode
      - lint-markdown
      - build-test
      - apparmor
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded (or cleanly skipped)
        run: |
          set -euo pipefail
          for result in \
            "${{ needs.lint-addon.result }}" \
            "${{ needs.lint-yaml.result }}" \
            "${{ needs.lint-dockerfile.result }}" \
            "${{ needs.lint-shell.result }}" \
            "${{ needs.lint-unicode.result }}" \
            "${{ needs.lint-markdown.result }}" \
            "${{ needs.build-test.result }}" \
            "${{ needs.apparmor.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "job failed: $result"; exit 1 ;;
            esac
          done
